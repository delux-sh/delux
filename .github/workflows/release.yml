name: Release

# A pushed v* tag builds all four targets and publishes a GitHub Release with
# the archives, SHA256SUMS and build provenance attestations. Running it
# manually builds the same archives as a workflow artifact without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.98.1"
  ZIG_VERSION: "0.17.0"
  ZIG_SHA256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a # zig-aarch64-macos
  CARGO_ZIGBUILD_VERSION: "0.23.4"
  CARGO_ABOUT_VERSION: "0.9.2"

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      # zig links the static Linux (musl) binaries; macOS builds natively for
      # both architectures.
      - name: Install zig
        run: |
          archive="zig-aarch64-macos-$ZIG_VERSION.tar.xz"
          curl -fsSLO "https://ziglang.org/download/$ZIG_VERSION/$archive"
          echo "$ZIG_SHA256  $archive" | shasum -a 256 -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-$ZIG_VERSION" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked --version "$CARGO_ZIGBUILD_VERSION"
      - name: Install license notice generator
        run: cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
      - run: scripts/dist.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delux-dist
          path: dist/
          if-no-files-found: error

  publish:
    # Only a public repository's pushed v* tag publishes; manual runs never do.
    if: github.event.repository.private == false && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: delux-dist
          path: dist
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Delux $GITHUB_REF_NAME" --generate-notes

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: delux-dist
          path: dist
      # HOMEBREW_TAP_TOKEN: a fine-grained token with contents read/write on
      # <owner>/homebrew-tap only. Without it, update the tap by hand.
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the tap update"
            exit 0
          fi
          version=${GITHUB_REF_NAME#v}
          scripts/homebrew-formula.sh "$version" dist/SHA256SUMS > delux.rb
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp delux.rb tap/Formula/delux.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/delux.rb
          git commit -m "delux $version"
          git push
