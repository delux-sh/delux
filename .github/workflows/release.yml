name: Release

# A pushed v* tag publishes only after native Homebrew checks on all four
# targets and release-environment approval. Manual runs build and check the
# same artifacts, but never publish or change the separately managed tap.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.98.1"
  ZIG_VERSION: "0.17.0"
  ZIG_SHA256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a # zig-aarch64-macos
  CARGO_ZIGBUILD_VERSION: "0.23.4"
  CARGO_ABOUT_VERSION: "0.9.2"

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Read release version and validate tag ancestry
        id: version
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$IS_TAG" = true ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
              exit 1
            fi
            # Full-history checkout is pinned to the event SHA, not a mutable
            # tag name. A release must come from protected main's history.
            git merge-base --is-ancestor "$GITHUB_SHA^{commit}" refs/remotes/origin/main
          fi
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      # zig links the static Linux (musl) binaries; macOS builds natively for
      # both architectures.
      - name: Install zig
        run: |
          archive="zig-aarch64-macos-$ZIG_VERSION.tar.xz"
          curl -fsSLO "https://ziglang.org/download/$ZIG_VERSION/$archive"
          echo "$ZIG_SHA256  $archive" | shasum -a 256 -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-$ZIG_VERSION" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked --version "$CARGO_ZIGBUILD_VERSION"
      - name: Install license notice generator
        run: cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
      - run: scripts/dist.sh
      - name: Stage reviewed release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cp "docs/releases/$VERSION.md" dist/RELEASE-NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delux-dist
          path: dist/
          if-no-files-found: error

  package:
    name: Homebrew (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            system: Darwin
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            system: Darwin
            arch: x86_64
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            system: Linux
            arch: aarch64
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            system: Linux
            arch: x86_64
            target: x86_64-unknown-linux-musl
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TARGET: ${{ matrix.target }}
      EXPECTED_SYSTEM: ${{ matrix.system }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require the native runner architecture
        run: |
          test "$(uname -s)" = "$EXPECTED_SYSTEM"
          test "$(uname -m)" = "$EXPECTED_ARCH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: delux-dist
          path: dist
      - name: Verify every archive checksum
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS
      - uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d
        with:
          stable: true
          core: false
          cask: false
      - name: Install the generated formula with its dependencies
        run: |
          brew tap-new --no-git delux-ci/release
          scripts/homebrew-formula.sh "$VERSION" dist/SHA256SUMS "file://$GITHUB_WORKSPACE/dist" \
            > "$(brew --repository delux-ci/release)/Formula/delux.rb"
          brew trust delux-ci/release
          brew install delux-ci/release/delux
      - name: Run formula test and strict audit
        run: |
          brew test delux-ci/release/delux
          brew audit --strict delux-ci/release/delux
      - name: Exercise the installed native picker
        run: |
          installed="$(brew --prefix delux-ci/release/delux)/bin/delux"
          archive_root="delux-$VERSION-$TARGET"
          tar -xzf "dist/$archive_root.tar.gz" -C "$RUNNER_TEMP" "$archive_root/delux"
          cmp "$installed" "$RUNNER_TEMP/$archive_root/delux"
          python3 scripts/smoke-release.py "$installed" --version "$VERSION"

  publish:
    # Only a public repository's pushed v* tag publishes; manual runs never do.
    if: github.event.repository.private == false && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: delux-dist
          path: dist
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Delux $GITHUB_REF_NAME" \
            --verify-tag --notes-file dist/RELEASE-NOTES.md
