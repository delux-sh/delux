name: iOS

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']

permissions:
  contents: read

jobs:
  ios:
    name: iOS simulator
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Select available iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for ds in devices.values() for d in ds if d["name"].startswith("iPhone")))')
          echo "IOS_DEVICE=$device" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          xcodebuild test -quiet -project ios/Delux.xcodeproj -scheme Delux \
            -destination "platform=iOS Simulator,id=$IOS_DEVICE" \
            -disableAutomaticPackageResolution -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=-
