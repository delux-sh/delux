name: Delux
options:
  bundleIdPrefix: sh.delux
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic

packages:
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh
    exactVersion: 0.15.1
  swift-nio:
    url: https://github.com/apple/swift-nio
    from: 2.81.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto
    from: 3.0.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0

targets:
  Delux:
    type: application
    platform: iOS
    sources:
      - path: Delux
      - path: ../adapters/reporting_setup.py
        buildPhase: resources
      - path: ../adapters/pi/delux-agent-status.ts
        buildPhase: resources
      - path: ../adapters/opencode/delux-agent-status.js
        buildPhase: resources
    dependencies:
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-crypto
        product: Crypto
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.delux.ios
        PRODUCT_NAME: Delux
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Delux/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Delux
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Delux discovers nearby SSH computers and connects to computers you add on your local network or VPN.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  DeluxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DeluxTests
    dependencies:
      - target: Delux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.delux.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Delux:
    build:
      targets:
        Delux: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DeluxTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
